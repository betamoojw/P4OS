# Builds the firmware for both chip profiles and every app against it, the
# ESP32-C6's firmware (c6/, docs/C6.md), the colour emoji pack
# (docs/EMOJI.md) and the Notes app's fonts, on each push and pull request. A tag v* also makes a
# release with them.
#
# What it does not build: the games' art packs (<app>_p4.pak) and SmartIR's
# library for Infrarrojo. Their sources (Blender renders, art, SmartIR's
# codes) do not live in this repository; they are made on the author's
# machine (apps/<app>/tools/pack_p4.py, apps/infrarrojo/tools/pack_smartir.py)
# and attached by hand once. Every release after that carries them over from
# the latest published one, on GitHub's side (CARRIED_PACKS below, and
# attach-packs.yml for a release already made): a 37 MB upload from home
# stalls more often than it goes through.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# a new push to the same branch cancels the run still going: the apps take
# ~45 minutes and only the last commit matters
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Apps that are built (so the CI still checks them) but not published: left
# out of apps.zip, web.zip and lang.zip. A directory of apps/, by name.
env:
  NOT_IN_RELEASE: pato
  # carried over from the latest published release into each new one
  CARRIED_PACKS: monsterhop_p4.pak turbo_p4.pak golf_p4.pak mila_p4.pak mila_p4.pak.1 mila_p4.pak.2 infrarrojo_p4.pak pinball_zombis_p4.pak pinball_robots_p4.pak pinball_jungla_p4.pak pinball_circo_p4.pak pinball_casino_p4.pak pinball_piratas_p4.pak

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: offline languages and Flash font resource
        run: |
          python -m unittest discover -s tests -p test_chinese.py
          python -m unittest discover -s tests -p test_web_assets.py
          python -m unittest discover -s tests -p test_utf8_native.py
          node --test tests/test_portal_language.cjs tests/test_portal_web.cjs
          python tools/gen_lang.py check zh-Hans
          python tools/gen_lang.py check zh-Hant

  firmware:
    runs-on: ubuntu-latest
    # IDF 5.5: the ESP32-C6 link (esp_hosted 1.4) is only validated there
    container: espressif/idf:release-v5.5
    strategy:
      fail-fast: false
      matrix:
        profile: [rev1_3, rev3_x]
    steps:
      # the whole history with its tags: the firmware's version is `git
      # describe --tags`, and without them (or with git refusing the
      # container's checkout as someone else's) the IDF names it "1"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: tools
        # m4 to curl: CAS's engine (GMP's configure wants m4 and a native cc)
        run: apt-get update && apt-get install -y --no-install-recommends zsh zip binutils m4 bzip2 xz-utils curl make gcc g++ libc6-dev perl
      - name: firmware
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git describe --tags --always --dirty
          . $IDF_PATH/export.sh
          tools/build_fw.sh ${{ matrix.profile }}
      # CAS's engine (apps/cas/engine): Giac and its runtime as PIC, not in
      # git; built once (~150 MB of sources checked by SHA-256, 10-15 min)
      # and kept in the cache while apps/cas/engine/ does not change
      - name: CAS engine (cache)
        id: cas-engine
        uses: actions/cache@v4
        with:
          path: apps/cas/engine/lib
          key: cas-engine-${{ hashFiles('apps/cas/engine/build_engine.sh', 'apps/cas/engine/*.cc', 'apps/cas/engine/*.c', 'apps/cas/engine/*.ld') }}
      - name: CAS engine
        if: steps.cas-engine.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          CAS_WORK=/tmp/cas-work apps/cas/engine/build_engine.sh
      # without its engine CAS cannot be built, and build_apps.sh would stop
      # there: the release goes out without CAS, and says so
      - name: CAS engine missing
        shell: bash
        run: |
          if [ ! -f apps/cas/engine/lib/libcasengine.a ]; then
            echo "::warning::CAS's engine did not build: this build leaves CAS out"
            rm -rf apps/cas
          fi
      - name: apps
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          python -m unittest discover -s tests -p test_dynamic_apps.py
          PROFILE=${{ matrix.profile }} tools/build_apps.sh
      - name: bundle
        shell: bash
        run: |
          p=${{ matrix.profile }}
          mkdir -p out
          # the image an OTA takes, and what a first flash over the CH340 needs
          cp build/$p/p4os.bin out/p4os-$p.bin
          # the ELF, for decoding a core dump of this very firmware
          # (tools/coredump.sh fetches it by the dump's version)
          xz -T0 -6 -c build/$p/p4os.elf > out/p4os-$p.elf.xz
          (cd build/$p && zip -q ../../out/p4os-$p-full.zip p4os.bin bootloader/bootloader.bin \
              partition_table/partition-table.bin ota_data_initial.bin cjk.bin flash_args)
          mkdir -p out/apps && cp apps/*/build/$p/*.so out/apps/
          # the modules an app loads itself (aos_hal_module_open), in apps/<app>/
          for m in apps/*/build/$p/modules; do
            [ -d "$m" ] || continue
            a=$(basename "$(dirname "$(dirname "$(dirname "$m")")")")
            mkdir -p "out/apps/$a"
            cp "$m"/*.so "out/apps/$a/"
          done
          for a in $NOT_IN_RELEASE; do
            rm -f "out/apps/$a.so"
            rm -rf "out/apps/$a"
          done
          (cd out && zip -qr apps-$p.zip apps)
          if [ "$p" = rev1_3 ]; then
            # the apps' own pages in the portal, for the card's /web (docs/PORTAL-PAGES.md)
            mkdir -p out/web && cp apps/*/web/*.js out/web/
            mkdir -p out/lang && cp -r lang/en lang/de lang/zh-Hans lang/zh-Hant out/lang/
            for a in $NOT_IN_RELEASE; do
              for so in apps/$a/build/$p/*.so; do [ -e "$so" ] && rm -f "out/apps/$(basename "$so")"; done
              rm -rf "out/apps/$a"
              for js in apps/$a/web/*.js; do
                [ -e "$js" ] || continue
                rm -f "out/web/$(basename "$js")"
                pg=$(basename "$js" .js)
                for lc in en de zh-Hans zh-Hant; do rm -f "out/lang/$lc/web.$pg.lang"; done
              done
              id=$(grep -ho '\.id *= *"[^"]*"' apps/$a/main/*.c | head -1 | sed 's/.*"\(.*\)"/\1/')
              if [ -n "$id" ]; then
                for lc in en de zh-Hans zh-Hant; do rm -f "out/lang/$lc/$id.lang"; done
              fi
              echo "left out of the release: $a ($id)"
            done
            (cd out && zip -qr apps.zip apps && rm -r apps)
            (cd out && zip -qr web.zip web && rm -r web)
            (cd out && zip -qr lang.zip lang && rm -r lang)
          else
            rm -r out/apps
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: p4os-${{ matrix.profile }}
          path: out/*

  # The C6's image, which the P4 installs from the card's /firmware/c6.bin
  # (Settings, Update, or tools/install_c6.sh)
  c6:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.5
    steps:
      - uses: actions/checkout@v5
      - name: firmware of the ESP32-C6
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          tools/build_c6.sh
          mkdir -p out
          cp c6/build/p4os_c6.bin out/c6.bin
      - uses: actions/upload-artifact@v5
        with:
          name: p4os-c6
          path: out/*

  # The packs made from free sources, each the same file every time (none is
  # kept in git): /fonts/emoji.pak from Noto's images at a fixed tag (15.5
  # MB), and the Notes app's fonts from Inter 4.1 (802 KB)
  packs:
    runs-on: ubuntu-latest
    env:
      NOTO_TAG: v2026-09-24-unicode18_0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: notas_p4.pak
        run: |
          npm install --global --silent lv_font_conv@1.5.3
          python3 apps/notas/tools/pack_fonts.py
          mkdir -p out
          cp apps/notas/build/notas_p4.pak out/
      - name: emoji.pak
        run: |
          pip install --quiet pillow
          git clone --quiet --depth 1 --branch "$NOTO_TAG" --filter=blob:none --sparse \
              https://github.com/googlefonts/noto-emoji.git noto
          (cd noto && git sparse-checkout set 2D/png/72 third_party/region-flags/png)
          mkdir -p out
          python3 tools/gen_emoji.py noto out/emoji.pak
      - uses: actions/upload-artifact@v5
        with:
          name: p4os-packs
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, c6, packs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: the packs of the latest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          from=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
          echo "packs from $from"
          for p in $CARRIED_PACKS; do
            gh release download "$from" --repo "${{ github.repository }}" -p "$p" -D dist --skip-existing || echo "not in $from: $p"
          done
          ls -la dist
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --draft \
            --title "P4OS ${{ github.ref_name }}" --notes "Draft - write the notes, attach the packs, then publish."
